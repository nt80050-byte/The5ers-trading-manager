
name: Build The5ers Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir source
          unzip -o The5ers_Trading_Manager_Android_Project_v1.zip -d source

      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/The5ersTradingManager/app/build.gradle.kts")
          s = p.read_text()

          marker = "    buildFeatures { compose = true }"

          fix = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }

          """

          if "jvmTarget = \"17\"" not in s:
              s = s.replace(marker, fix + marker)

          p.write_text(s)
          print("Java and Kotlin targets aligned to 17")
          PY

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/The5ersTradingManager
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The5ers-Trading-Manager-APK
          path: source/The5ersTradingManager/app/build/outputs/apk/debug/app-debug.apk
          
